<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>บันทึกสถิติ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px} header small{opacity:.75}
nav{display:flex;gap:8px;padding:10px;background:white;position:sticky;top:73px;z-index:4;border-bottom:1px solid #ddd}
nav button{flex:1;border:0;border-radius:12px;padding:11px 5px;background:#e5e7eb;font-weight:700}nav button.active{background:#111827;color:#fff}
main{max-width:700px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.primary{width:100%;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-size:17px;font-weight:800;margin-top:14px}
button.secondary{padding:10px 12px;border:0;border-radius:10px;background:#e5e7eb;font-weight:700}
button.danger{background:#fee2e2;color:#991b1b}
.choice{display:flex;gap:8px}.choice button{flex:1;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-weight:700}.choice button.selected{background:#111827;color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f9fafb;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px;margin-top:3px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.entry{border-top:1px solid #eee;padding:12px 0}.entry:first-child{border-top:0}.plus{color:#047857;font-weight:800}.minus{color:#b91c1c;font-weight:800}
.hidden{display:none}.muted{color:#6b7280;font-size:13px}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar>*{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}
</style>
</head>
<body>
<header><h1>📊 บันทึกสถิติ</h1><small>บันทึกข้อมูลส่วนตัวบนเครื่องนี้</small></header>
<nav>
<button class="active" onclick="showTab('add',this)">➕ บันทึก</button>
<button onclick="showTab('history',this)">📋 ประวัติ</button>
<button onclick="showTab('stats',this)">📈 สถิติ</button>
</nav>
<main>
<section id="add">
<div class="card">
<label>คีม</label><input id="kim" placeholder="เช่น คีม 1">
<label>ขา</label><input id="leg" placeholder="เช่น ขา 2">
<label>เล่น คู่ หรือ คี่</label>
<div class="choice"><button id="even" onclick="pickOddEven('คู่')">คู่</button><button id="odd" onclick="pickOddEven('คี่')">คี่</button></div>
<label>จำนวนเงิน</label><input id="money" type="number" inputmode="decimal" placeholder="บาท">
<label>น้ำหนักที่ออก</label><input id="weight" type="number" step="0.01" inputmode="decimal" placeholder="เช่น 1.25">
<label>สัญลักษณ์</label><input id="symbol" placeholder="เช่น ⭐ / A / B">
<label>ผล +,-</label>
<div class="choice"><button id="win" onclick="pickResult('+')">+</button><button id="loss" onclick="pickResult('-')">-</button></div>
<label>หมายเหตุ</label><textarea id="note" rows="3" placeholder="รายละเอียดเพิ่มเติม"></textarea>
<button class="primary" onclick="saveEntry()">💾 บันทึกข้อมูล</button>
</div>
</section>

<section id="history" class="hidden">
<div class="card">
<div class="toolbar"><input id="search" placeholder="ค้นหา..." oninput="renderHistory()"><button class="secondary danger" onclick="clearAll()">ล้างทั้งหมด</button></div>
<div id="historyList"></div>
</div>
</section>

<section id="stats" class="hidden">
<div class="card">
<h3>📈 สรุปทั้งหมด</h3>
<div class="stats" id="statsGrid"></div>
</div>
<div class="card">
<h3>📊 สถิติตามคู่/คี่</h3><div id="oddEvenStats"></div>
</div>
<div class="card">
<h3>📊 สถิติตามคีม</h3><div id="kimStats"></div>
</div>
<div class="card">
<h3>📊 สถิติตามขา</h3><div id="legStats"></div>
</div>
<div class="card">
<h3>📊 สถิติตามสัญลักษณ์</h3><div id="symbolStats"></div>
</div>
<div class="card">
<button class="secondary" onclick="exportCSV()">⬇️ ส่งออก CSV</button>
</div>
</section>
</main>
<script>
let entries=JSON.parse(localStorage.getItem('statEntries')||'[]');
let oddEven='', result='';

function showTab(id,btn){
 document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
 btn.classList.add('active');
 if(id==='history')renderHistory(); if(id==='stats')renderStats();
}
function pickOddEven(v){oddEven=v;document.getElementById('even').classList.toggle('selected',v==='คู่');document.getElementById('odd').classList.toggle('selected',v==='คี่')}
function pickResult(v){result=v;document.getElementById('win').classList.toggle('selected',v==='+');document.getElementById('loss').classList.toggle('selected',v==='-')}
function saveEntry(){
 const e={id:Date.now(),date:new Date().toLocaleString('th-TH'),kim:kim.value.trim(),leg:leg.value.trim(),oddEven,money:Number(money.value)||0,weight:Number(weight.value)||0,symbol:symbol.value.trim(),result,note:note.value.trim()};
 if(!e.oddEven||!e.result){alert('กรุณาเลือก คู่/คี่ และ ผล +/-');return}
 entries.unshift(e);localStorage.setItem('statEntries',JSON.stringify(entries));
 ['kim','leg','money','weight','symbol','note'].forEach(id=>document.getElementById(id).value='');
 oddEven='';result='';document.querySelectorAll('.choice button').forEach(x=>x.classList.remove('selected'));
 alert('บันทึกเรียบร้อยครับ');renderStats();
}
function renderHistory(){
 const q=(document.getElementById('search').value||'').toLowerCase();
 const list=entries.filter(e=>JSON.stringify(e).toLowerCase().includes(q));
 historyList.innerHTML=list.length?list.map(e=>`<div class="entry">
<div class="row"><b>${e.oddEven} · ${e.kim||'-'} · ${e.leg||'-'}</b><span class="${e.result==='+'?'plus':'minus'}">${e.result}</span></div>
<div>💰 ${e.money.toLocaleString()} บาท · ⚖️ ${e.weight||0} · 🔰 ${e.symbol||'-'}</div>
<div class="muted">${e.date}${e.note?' · '+e.note:''}</div>
<div style="margin-top:6px"><button class="secondary danger" onclick="deleteEntry(${e.id})">ลบ</button></div>
</div>`).join(''):'<p class="muted">ยังไม่มีข้อมูล</p>';
}
function deleteEntry(id){if(confirm('ลบรายการนี้?')){entries=entries.filter(e=>e.id!==id);localStorage.setItem('statEntries',JSON.stringify(entries));renderHistory();renderStats()}}
function clearAll(){if(confirm('ต้องการลบข้อมูลทั้งหมดจริงหรือไม่?')){entries=[];localStorage.removeItem('statEntries');renderHistory();renderStats()}}
function summary(arr){
 const n=arr.length, plus=arr.filter(e=>e.result==='+').length, minus=n-plus;
 const money=arr.reduce((s,e)=>s+(e.result==='+'?e.money:-e.money),0);
 const avg=arr.length?arr.reduce((s,e)=>s+e.weight,0)/arr.length:0;
 return {n,plus,minus,money,avg};
}
function groupStats(field){
 const m={};entries.forEach(e=>{const k=e[field]||'-';(m[k]??=[]).push(e)});
 return Object.entries(m).sort((a,b)=>b[1].length-a[1].length).map(([k,a])=>{const s=summary(a);return `<div class="entry"><b>${k}</b><br>ทั้งหมด ${s.n} · + ${s.plus} · - ${s.minus} · เงินสุทธิ <span class="${s.money>=0?'plus':'minus'}">${s.money.toLocaleString()} บาท</span></div>`}).join('')||'<p class="muted">ยังไม่มีข้อมูล</p>';
}
function renderStats(){
 const s=summary(entries);
 statsGrid.innerHTML=`<div class="stat">รายการ<b>${s.n}</b></div><div class="stat">ผล +<b>${s.plus}</b></div><div class="stat">ผล -<b>${s.minus}</b></div><div class="stat">เงินสุทธิ<b class="${s.money>=0?'plus':'minus'}">${s.money.toLocaleString()}</b></div><div class="stat">น้ำหนักเฉลี่ย<b>${s.avg.toFixed(2)}</b></div>`;
 oddEvenStats.innerHTML=groupStats('oddEven'); kimStats.innerHTML=groupStats('kim'); legStats.innerHTML=groupStats('leg'); symbolStats.innerHTML=groupStats('symbol');
}
function exportCSV(){
 if(!entries.length){alert('ยังไม่มีข้อมูล');return}
 const head=['วันที่','คีม','ขา','คู่/คี่','จำนวนเงิน','น้ำหนัก','สัญลักษณ์','ผล','หมายเหตุ'];
 const rows=entries.map(e=>[e.date,e.kim,e.leg,e.oddEven,e.money,e.weight,e.symbol,e.result,e.note]);
 const csv='\ufeff'+[head,...rows].map(r=>r.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='บันทึกสถิติ.csv';a.click();URL.revokeObjectURL(a.href);
}
renderStats();
</script>
</body></html>
